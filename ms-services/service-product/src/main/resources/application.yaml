spring:
  profiles:
    include: sentinel
  application:
    name: service-product
  cloud:
    nacos:
      server-addr: 192.168.31.129:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false # 禁用nacos配置导入检查

server:
  port: 9000

# 开启feign包下的debug级别日志
logging:
  pattern:
    level: ${spring.application.name},%X{traceId:-},%X{spanId:-}

management:
  otlp:
    metrics:
      export:
        enabled: true
    tracing:
      endpoint: http://192.168.31.200:30159/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
