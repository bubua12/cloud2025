spring:
  application:
    name: seata-order
  datasource:
    url: jdbc:mysql://192.168.31.127:3306/order_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&logger=Slf4JLogger&profileSQL=true
    username: root
    password: bubua12
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: ${NACOS_URL:http://127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      config:
        import-check:
          enabled: false

server:
  port: 22000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志

otel:
  service:
    name: bubua12-${spring.application.name}
  propagators: tracecontext,baggage
  resource:
    attributes:
      deployment:
        environment: prod
      service:
        namespace: ms.microservices

management:
  tracing:
    enabled: true
    propagation:
      type: W3C

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n'