spring:
  application:
    name: seata-order
  datasource:
    url: jdbc:mysql://192.168.1.242:3306/order_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&logger=Slf4JLogger&profileSQL=true
    username: root
    password: bubua12
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: order-db-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 启用连接池监控
      register-mbeans: true
      # 数据库连接池监控
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # MySQL监控相关
        logger: Slf4JLogger
        profileSQL: true
        slowQueryThresholdMillis: 1000
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false

server:
  port: 22000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志

management:
  otlp:
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
  # 启用更多监控指标
  metrics:
    export:
      otlp:
        enabled: true
        endpoint: http://192.168.1.242:4318/v1/metrics
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jdbc.connections.active: true
        jdbc.connections.max: true
        hikaricp.connections: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,tracing,beans,env

# OpenTelemetry 自动仪表配置
otel:
  instrumentation:
    jdbc:
      enabled: true
    mybatis:
      enabled: true
  exporter:
    otlp:
      endpoint: http://192.168.1.242:4318
  resource:
    attributes:
      service.name: seata-order
      service.version: 1.0.0
  traces:
    exporter: otlp
  metrics:
    exporter: otlp

# OpenTelemetry 链路传播配置 - 关键配置
#otel:
#  propagators:
#    - tracecontext
#    - baggage
#  service:
#    name: seata-order
#  resource:
#    attributes:
#      service.name: seata-order
#      service.version: 1.0.0

# 开启链路追踪日志 - 修复日志中traceId显示问题
logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
    # 数据库相关追踪日志
    io.opentelemetry.instrumentation.jdbc: DEBUG
    io.opentelemetry.instrumentation.mybatis: DEBUG
    org.springframework.jdbc: DEBUG
    com.bubua12.cloud.order.mapper: DEBUG
    # 连接池监控
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.pool: DEBUG
    # MyBatis监控
    org.apache.ibatis: DEBUG
    # 事务监控
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    # MySQL驱动监控
    com.mysql.cj: DEBUG
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
    # 增加更详细的日志信息
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n'