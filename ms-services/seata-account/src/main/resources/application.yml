# 启用所有观测功能
spring:
  application:
    name: seata-account
  datasource:
    url: jdbc:otel:mysql://192.168.1.242:3306/account_db?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: bubua12
    driver-class-name: io.opentelemetry.instrumentation.jdbc.OpenTelemetryDriver
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false
server:
  port: 20001

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志
#seata:
#  data-source-proxy-mode: XA

management:
  observations:
    key-values:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: true
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
  endpoint:
    web:
      exposure:
        include: "*"
  # 这个非常关键！
  zipkin:
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  # 启用所有观测功能
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jdbc.connections: true


logging:
  level:
    com.bubua12.cloud.account.mapper: DEBUG