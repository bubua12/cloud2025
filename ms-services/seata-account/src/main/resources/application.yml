spring:
  application:
    name: seata-account
  datasource:
    url: jdbc:mysql://192.168.1.242:3306/account_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&logger=Slf4JLogger&profileSQL=true
    username: root
    password: bubua12
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false
server:
  port: 20001

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志

otel:
  service:
    name: bubua12-${spring.application.name}
  propagators: tracecontext,baggage
  resource:
    attributes:
      deployment:
        environment: prod
      service:
        namespace: ms.microservices

management:
  tracing:
    enabled: true
    propagation:
      type: W3C

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n'