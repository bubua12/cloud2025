spring:
  profiles:
    include: feign,sentinel
  config:
    import:
      - nacos:common.properties?group=order
      - nacos:database.properties?group=order
  application:
    name: service-order
  cloud:
    nacos:
      config:
        namespace: 1a66b752-f1f1-422a-8a33-b8d7327f9aa5
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos


server:
  port: 8000

# 开启feign包下的debug级别日志
logging:
  level:
    com.bubua12.cloud.order.feign: debug
  pattern:
    level: ${spring.application.name},%X{traceId:-},%X{spanId:-}

management:
  otlp:
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
