spring:
  profiles:
    include: feign,sentinel
  config:
    import:
      - nacos:common.properties?group=order
      - nacos:database.properties?group=order
  application:
    name: service-order
  cloud:
    nacos:
      config:
        namespace: 1a66b752-f1f1-422a-8a33-b8d7327f9aa5
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos


otel:
  propagators:
    - tracecontext
    - baggage

server:
  port: 8024

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n'
