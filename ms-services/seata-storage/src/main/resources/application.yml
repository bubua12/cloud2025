spring:
  application:
    name: seata-storage
  datasource:
    url: jdbc:mysql://192.168.1.242:3306/storage_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&logger=Slf4JLogger&profileSQL=true
    username: root
    password: bubua12
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: storage-db-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      register-mbeans: true
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        logger: Slf4JLogger
        profileSQL: true
        slowQueryThresholdMillis: 1000
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false
server:
  port: 23000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志

management:
  otlp:
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 采样率100%
  endpoints:
    web:
      exposure:
        include: health,info,metrics,tracing

# 开启链路追踪日志 - 修复日志中traceId显示问题
logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
    # 数据库相关追踪日志
    io.opentelemetry.instrumentation.jdbc: DEBUG
    io.opentelemetry.instrumentation.mybatis: DEBUG
    org.springframework.jdbc: DEBUG
    com.bubua12.cloud.storage.mapper: DEBUG
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

debug: true