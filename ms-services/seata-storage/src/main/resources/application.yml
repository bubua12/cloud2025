spring:
  application:
    name: seata-storage
  datasource:
    url: jdbc:mysql://192.168.1.242:3306/storage_db?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: bubua12
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false
server:
  port: 23000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开启MyBatis SQL日志

management:
  otlp:
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
  endpoints:
    web:
      exposure:
        include: health,info,metrics,tracing

# OpenTelemetry 链路传播配置 - 关键配置
otel:
  propagators:
    - tracecontext
    - baggage
  service:
    name: seata-storage
  resource:
    attributes:
      service.name: seata-storage
      service.version: 1.0.0

# 开启链路追踪日志 - 修复日志中traceId显示问题
logging:
  level:
    org.springframework.cloud.openfeign: DEBUG
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'