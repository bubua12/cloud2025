spring:
  profiles:
    include: route
  application:
    name: ms-gateway
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      discovery:
        metadata:
          env: prod
          version: 1.1.2-prod

server:
  port: 80

# 开启feign包下的debug级别日志
logging:
  pattern:
    level: trace_id=%mdc{trace_id} span_id=%mdc{span_id} %5p
#    level: ${spring.application.name},%X{traceId:-},%X{spanId:-}
