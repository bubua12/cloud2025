spring:
  profiles:
    include: route # 包含路由配置文件
  application:
    name: ms-gateway
  cloud:
    nacos:
      server-addr: 192.168.1.242:8848
      username: nacos
      password: nacos
      discovery:
        metadata:
          env: prod
          version: 1.1.2-prod

server:
  port: 2222


management:
  otlp:
    metrics:
      export:
        enabled: true
    tracing:
      endpoint: http://192.168.1.242:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%