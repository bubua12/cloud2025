spring:
  profiles:
    include: route
  application:
    name: ms-gateway
  cloud:
    nacos:
      server-addr: 192.168.31.129:8848
      username: nacos
      password: nacos
      discovery:
        metadata:
          env: prod
          version: 1.1.2-prod

server:
  port: 80

# 开启feign包下的debug级别日志
logging:
  pattern:
    level: ${spring.application.name},%X{traceId:-},%X{spanId:-}

management:
  otlp:
    tracing:
      endpoint: http://192.168.31.200:30159/v1/traces
  tracing:
    sampling:
      probability: 1.0 # 采样率100%
